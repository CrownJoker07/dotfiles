# Shell and prompt

[zsh] # 交互式命令行 shell，适合日常终端操作、运行脚本，以及配合补全、高亮和提示符插件使用；macOS 已内置，Arch 需安装此包
# 使用：在终端执行 zsh 可临时进入；需要作为默认登录 shell 时执行 chsh -s "$(command -v zsh)"，重新登录后生效；用户配置写在 ~/.zshrc
macos.system = zsh
arch.pacman = zsh

[zsh autosuggestions] # 根据命令历史在光标后显示灰色建议，适合重复长命令、Git 命令和常用目录操作，减少重复输入
# 使用：在 ~/.zshrc 中 source 插件脚本后重启 shell；输入命令前缀即可看到建议，通常按右方向键接受整条建议
macos.formula = zsh-autosuggestions
arch.pacman = zsh-autosuggestions

[zsh completions] # 扩充 zsh 对更多命令、参数和子命令的 Tab 补全定义，适合依赖 CLI 工具完成开发和系统管理的场景
# 使用：把包提供的补全目录加入 fpath，并在 ~/.zshrc 中执行 compinit；输入命令或参数前缀后按 Tab 查看和选择候选项
macos.formula = zsh-completions
arch.pacman = zsh-completions

[zsh syntax highlighting] # 在执行前按语法着色命令、参数、引号和路径，并直观标出无效命令，适合交互式输入时快速发现拼写或引用错误
# 使用：在 ~/.zshrc 末尾 source 插件脚本，确保它在其他会修改命令行缓冲区的插件之后加载；重新打开 shell 后自动生效
macos.formula = zsh-syntax-highlighting
arch.pacman = zsh-syntax-highlighting

[starship] # 跨平台命令行提示符，适合在 macOS、Linux 和 Windows 上统一显示当前目录、Git 状态、语言版本、命令耗时及退出状态
# 使用：zsh 在 ~/.zshrc 中加入 eval "$(starship init zsh)"；PowerShell 在 $PROFILE 中加入 Invoke-Expression (&starship init powershell)；外观写在 ~/.config/starship.toml
macos.formula = starship
arch.pacman = starship
windows.winget = Starship.Starship

[powershell] # Windows 的现代跨平台命令行 shell，适合在 WezTerm 中执行系统管理、自动化脚本和 .NET 命令，并加载 PowerShell 7 profile
# 使用：在 WezTerm 中启动 pwsh；用 $PROFILE 查看当前配置文件路径，并在该文件中配置 Starship、别名和模块，重开会话后加载
windows.winget = Microsoft.PowerShell


# Terminal and session

[wezterm] # 终端模拟器；承载 zsh、tmux 和 Neovim 等终端工作流
macos.cask = wezterm
arch.pacman = wezterm
windows.winget = wez.wezterm

[tmux] # 在一个终端窗口里管理多个会话、窗口和面板，远程连接断开后也能保留会话
macos.formula = tmux
arch.pacman = tmux

[tmux plugin manager] # 管理 tmux 插件
macos.formula = tpm
arch.aur = tmux-plugin-manager

# File, search, and navigation

[fd] # 简洁快速的递归文件查找工具，适合按名称定位源码、配置和目录，或把结果交给编辑器及其他命令处理；默认使用正则表达式匹配，并跳过隐藏项和 .gitignore 排除的内容
# 使用：fd PATTERN 从当前目录查找，fd PATTERN PATH 指定搜索目录，fd -e lua 只找 Lua 文件，fd -t f/-t d 只找文件/目录；用 -H 包含隐藏项，-I 包含被忽略项，-0 可安全地将特殊文件名传给支持 NUL 分隔的命令
macos.formula = fd
arch.pacman = fd
windows.winget = sharkdp.fd

[fzf] # 通用的终端模糊筛选器：从标准输入接收文件、命令历史、Git 分支或进程等列表，边输入关键词边缩小候选范围，并把选中项输出给下一条命令；也为 Neovim 的 fzf-lua 提供底层筛选能力
# 使用：fd -t f | fzf 交互选择文件，nvim "$(fd -t f | fzf)" 选择后用 Neovim 打开，git branch --format='%(refname:short)' | fzf 筛选分支；方向键移动、Enter 确认、Esc 取消，Ctrl-R 历史搜索等快捷键需另外启用对应的 Shell 集成
macos.formula = fzf
arch.pacman = fzf
windows.winget = junegunn.fzf

[ripgrep] # 高速递归文本搜索工具，适合在整个项目中定位函数、配置项、错误信息和调用位置；默认显示文件名与行号、使用正则表达式，并遵循 .gitignore 跳过依赖和构建产物，也为 Neovim 的 fzf-lua 实时文本搜索提供后端
# 使用：rg PATTERN 搜索当前目录，rg PATTERN PATH 指定范围，rg -F 'TEXT' 按字面量搜索，rg -t lua PATTERN 只搜 Lua 文件，rg -g '*.toml' PATTERN 按路径规则筛选；用 -i 忽略大小写，--hidden 包含隐藏项，--no-ignore 包含被忽略项
macos.formula = ripgrep
arch.pacman = ripgrep
windows.winget = BurntSushi.ripgrep.MSVC

[zoxide] # 记录常用目录并按频率跳转，用 z 命令快速进入项目目录
macos.formula = zoxide
arch.pacman = zoxide
windows.winget = ajeetdsouza.zoxide


