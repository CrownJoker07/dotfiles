# Load with codex -p dotfiles; settings not listed here remain in ~/.codex/config.toml.
model = "gpt-6.1-sol"
model_reasoning_effort = "medium"
plan_mode_reasoning_effort = "max"
service_tier = "default"

# Models: deepseek-v4-flash, deepseek-v4-pro
[model_providers.deepseek]
name = "DeepSeek"
base_url = "https://api.deepseek.com"
env_key = "DEEPSEEK_API_KEY"
wire_api = "responses"

# Model: deepseek-v4.1-flash
# Responses API compatibility still needs verification.
[model_providers.token-factory]
name = "Token Factory"
base_url = "https://proxy.token-factory.digicore-ai.com/v1"
env_key = "TF_API_KEY"
wire_api = "responses"
